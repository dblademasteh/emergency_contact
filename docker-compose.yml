name: emergency-contacts-prod

# Use a dedicated custom network instead of the default bridge, which is
# missing/broken on this NAS. This avoids disrupting other apps (e.g. fsis).
networks:
  emergency-net:
    name: emergency-network
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: emergency-contacts-db
    restart: unless-stopped
    networks:
      - emergency-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emergency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-emergency_contacts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emergency} -d ${POSTGRES_DB:-emergency_contacts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build using the host network (default bridge is broken on this NAS,
      # and buildx isn't available to create a custom builder).
      network: host
    container_name: emergency-contacts
    restart: unless-stopped
    networks:
      - emergency-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-emergency}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-emergency_contacts}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    ports:
      - "18081:3000"

  # Exposes the app to the internet via a Cloudflare Tunnel (no port forwarding).
  # Uses a REMOTELY-MANAGED tunnel: a token (from the Zero Trust dashboard)
  # tells cloudflared which tunnel to join. Ingress rules live on Cloudflare's
  # side (Zero Trust → Networks → Tunnels → <tunnel> → Public Hostname), so no
  # local config file is needed.
  #
  # Get/refresh the token: Zero Trust → Networks → Tunnels → <tunnel> →
  # Overview → Configure → Docker → copy the `--token eyJ...` value.
  # If the token expires (cloudflared log: "token has expired" / won't connect),
  # grab a fresh one from the dashboard, update CLOUDFLARED_TOKEN in `.env`,
  # then: docker compose up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: emergency-contacts-cloudflared
    restart: unless-stopped
    networks:
      - emergency-net
    depends_on:
      app:
        condition: service_started
    # --protocol http2 runs the tunnel over TCP/443 instead of QUIC/UDP,
    # which survives NATs/routers that stall long-lived UDP flows.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARED_TOKEN}

volumes:
  pgdata: