name: emergency-contacts

# Dokploy deployment manifest.
#
# Dokploy reads this file, builds the app container, and manages the
# environment variables, domains, and auto-deploy from git.
#
# Setup in Dokploy:
#   1. Create a new "Application" (or "Dockerfile" app).
#   2. Point it at this repo (or upload this compose).
#   3. Add the required environment variables in the dashboard (see below).
#   4. Set the health check path to /api/auth/me.
#   5. Optionally attach a Postgres service or use an external DB.
#
# Required environment variables (set in the Dokploy dashboard):
#   DATABASE_URL      postgresql://user:password@host:5432/dbname
#   SESSION_SECRET    64-char hex string (openssl rand -hex 32)
#   NODE_ENV          production
#
# Optional:
#   PORT              3000 (default)
#   POSTGRES_USER     (only if using Dokploy's managed Postgres)
#   POSTGRES_PASSWORD
#   POSTGRES_DB
#   CLOUDFLARED_TOKEN (if you want the Cloudflare Tunnel service below)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency-contacts
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-3000}/api/auth/me || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: emergency-contacts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emergency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-emergency_contacts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emergency} -d ${POSTGRES_DB:-emergency_contacts}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Keep this service in a separate network so it's not exposed publicly.
    # In Dokploy, set the "db" service to "Internal" networking.

  # Optional Cloudflare Tunnel — enable in Dokploy by setting CLOUDFLARED_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: emergency-contacts-cloudflared
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARED_TOKEN}
    environment:
      - CLOUDFLARED_TOKEN=${CLOUDFLARED_TOKEN}
    # Only include this service when CLOUDFLARED_TOKEN is set.

volumes:
  pgdata: